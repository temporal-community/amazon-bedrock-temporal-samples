[project]
name = "strands-orchestrated-finance-assistant"
version = "0.1.0"
description = "Multi-agent financial advisory system using Strands Agents for orchestration"
authors = [{name = "Finance Assistant Team"}]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "bedrock-agentcore>=0.1.7",
    "bedrock-agentcore-starter-toolkit>=0.1.24",
    "boto3>=1.40.27",
    "botocore>=1.40.27",
    "matplotlib>=3.10.6",
    "pandas>=2.3.2",
    "pydantic>=2.11.7",
    "strands-agents>=1.7.1",
    "strands-agents-tools>=0.2.6",
    "yfinance>=0.2.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true